name: 02-03 Workflow With Trivy Check
on:
  # Run automatically when app code, tests, or this workflow file changes.
  push:
    paths:
      - "app/**"
      - "tests/**"
      - ".github/workflows/03-ci-build.yml"
  # Allow a safe manual run before students trigger it with a code change.
  workflow_dispatch:

permissions:
  id-token: write # This is the magic line for OIDC
  contents: read  # This is required for actions/checkout

env:
  # Keep common image values in one place so the build steps stay readable.
  IMAGE_NAME: tiny-health-app
  IMAGE_TAR: tiny-health-app.tar
  ARTIFACT_NAME: tiny-health-app-image

  AWS_REGION: ${{ secrets.AWS_REGION }}
  ECR_REPOSITORY: gitactions-repo # The name of your ECR repo

jobs:
 run-tests:
    # The runner is the temporary machine that executes the steps below.
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        # Download the repository contents onto the runner.
        uses: actions/checkout@v6

      - name: Set up Python
        # Prepare Python on the runner. This does not change the student laptop.
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Run tests
        # This is the key verification step in the CI workflow.
        run: python -m unittest discover -s tests -v


 build-package:
    # Use a fresh GitHub-hosted runner for the build.
    runs-on: ubuntu-latest
    needs: run-tests
    steps:
      - name: Check out repository
        # Get the repository files onto the runner.
        uses: actions/checkout@v6

      - name: Set up Python
        # Prepare Python so the workflow can run the tests first.
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Run tests
        # Build only after the verification step passes.
        run: python -m unittest discover -s tests -v



      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v3
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/github-role
          aws-region: ${{ secrets.AWS_REGION }}

      # Log in to ECR (AWS now knows who you are!)
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2
        with:
          registry-type: public




      - name: Set image tag
        # Use today's UTC date plus the GitHub run ID.
        id: image-tag
        run: |
          IMAGE_TAG="my-image"
          echo "image_tag=$IMAGE_TAG" >> "$GITHUB_OUTPUT"










      # 1. Build the image locally first
      - name: Build Docker image
        env:
          IMAGE_TAG: ${{ steps.image-tag.outputs.image_tag }}
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          docker build -t public.ecr.aws/b1h5p0w8/gitactions-repo:${{ steps.image-tag.outputs.image_tag }} .

      # 2. Run Trivy (The Security Gate)
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action
        with:
          image-ref: 'public.ecr.aws/b1h5p0w8/gitactions-repo:${{ steps.image-tag.outputs.image_tag }}'
          format: 'table'
          exit-code: '1' # This "breaks" the pipeline if it finds issues
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

      # 3. Push only if Trivy passed (Steps below won't run if Trivy exits with 1)
      - name: Push to ECR Public
        run: |
          # Tag as latest as well
          docker tag public.ecr.aws/b1h5p0w8/gitactions-repo:${{ steps.image-tag.outputs.image_tag }} public.ecr.aws/b1h5p0w8/gitactions-repo:latest
          
          # Push both tags
          docker push public.ecr.aws/b1h5p0w8/gitactions-repo:${{ steps.image-tag.outputs.image_tag }}
          docker push public.ecr.aws/b1h5p0w8/gitactions-repo:latest